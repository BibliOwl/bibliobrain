name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, dependencies
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify dependency lock is current
        run: |
          uv pip compile requirements.txt --generate-hashes --python-platform x86_64-pc-windows-msvc --python-version 3.14 --no-emit-package torch --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Dependency vulnerability audit
        # Temporary exceptions and compensating controls are documented in SECURITY.md.
        # ChromaDB's embedded-only usage is enforced by tests/test_chromadb_security.py.
        run: >-
          python -m pip_audit -r requirements.lock --disable-pip
          --progress-spinner off
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815

  frontend:
    name: JavaScript lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked frontend tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: JavaScript dependency vulnerability audit
        run: npm audit --audit-level=high --ignore-scripts

  browser:
    name: Browser tests
    # The tests drive the installed Microsoft Edge (Playwright channel "msedge").
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked frontend tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Browser regression tests
        run: npm run test:browser

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
