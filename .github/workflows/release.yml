# Publishes a release when a version tag is pushed:
#   python scripts/release_tools.py prepare X.Y.Z, commit, then
#   git tag -a vX.Y.Z -m "Bibliobrain X.Y.Z" && git push origin HEAD vX.Y.Z
# The release carries the installer, the same files as a ZIP package (for
# antivirus software that quarantines the unsigned installer) and latest.json,
# the manifest the in-app update check reads (src/update_check.py). Prereleases
# (vX.Y.Z-beta.1) are published as such and never reach "releases/latest", so
# users are not offered them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check that the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION ($version)."
          }

      - name: Install Inno Setup when the image lacks it
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }

      # Installs, repairs, upgrades and uninstalls the package in a temporary
      # folder, and checks what Setup does when install.ps1 succeeds or fails.
      - name: Smoke-test the installer package
        shell: pwsh
        run: ./packaging/test-installer-payload.ps1

      # The manifest hashes the final file, so it is written after signing.
      - name: Build the installer
        shell: pwsh
        run: ./packaging/build-installer.ps1

      # Free code signing for open source by SignPath Foundation. Enabled by the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN; without them the release ships unsigned as before.
      - name: Upload the unsigned installer
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/Bibliobrain-Setup-*.exe

      - name: Sign the installer with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: bibliobrain
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace the installer by the signed one
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter "Bibliobrain-Setup-*.exe" | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no installer." }
          Copy-Item -LiteralPath $signed.FullName -Destination dist -Force
          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path dist $signed.Name)
          if ($signature.Status -ne "Valid") { throw "Installer signature is $($signature.Status)." }

      - name: Write the update manifest
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $installer = Get-Item "dist/Bibliobrain-Setup-$version.exe"
          python scripts/release_tools.py manifest `
            --installer $installer.FullName `
            --archive dist/Bibliobrain-Windows.zip `
            --release-base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" `
            --version $version `
            --output-dir dist
          if ($LASTEXITCODE -ne 0) { throw "The update manifest could not be written." }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Required by the SignPath Foundation terms on the download page. Added
          # here and not in the manifest, whose notes are shown inside the app.
          if ("${{ vars.SIGNPATH_ORGANIZATION_ID }}" -ne "") {
            Add-Content -LiteralPath dist/release-notes.md -Encoding utf8 -Value @(
              "",
              "---",
              "Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)."
            )
          }
          $arguments = @(
            "release", "create", $tag,
            "dist/Bibliobrain-Setup-$($tag.TrimStart('v')).exe", "dist/Bibliobrain-Windows.zip", "dist/latest.json",
            "--title", "Bibliobrain $($tag.TrimStart('v'))",
            "--notes-file", "dist/release-notes.md"
          )
          if ($tag.Contains("-")) { $arguments += "--prerelease" }
          gh @arguments
